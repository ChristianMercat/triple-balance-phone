<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2140" viewBox="0 0 1400 2140" role="img" aria-labelledby="title description">
<title id="title">Triple Balance: a compressed decision diagram</title>
<desc id="description">Pay once for zero to three technologies, then follow six policy rounds, three random-event slots, and up to three technology choices. Events follow policy rounds 1, 3 and 4; technology slots follow rounds 2, 5 and 6. Each policy has three options; each event slot has seven routes. Technology slots are skipped automatically unless paid for. Dashed red branches end at Game Over when happiness or money reaches zero. Lines rejoin to save space, but different routes keep their own resources. There are 3,597,500 successful playthroughs and 456,680 early endings, totalling 4,054,180.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker>
<marker id="stop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b42336"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}
.title{font-size:34px;font-weight:bold}.section{font-size:24px;font-weight:bold}
.main{font-size:21px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.tiny{font-size:15px}
.box{stroke:#354b63;stroke-width:2;rx:10}
.flow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
.fail{fill:none;stroke:#b42336;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#stop-arrow)}
</style></defs>
<rect width="1400" height="2140" fill="white"/>

<text x="64" y="65" class="title" text-anchor="start">One game, millions of possible paths</text>
<text x="64" y="105" class="body" text-anchor="start">A compressed decision diagram: every route keeps its own choices and resources.</text>
<text x="64" y="145" class="section" text-anchor="start">1. Pay for research before the first policy round</text>
<rect class="box" x="500" y="165" width="400" height="56" fill="#fff1c9"/>
<text x="700.0" y="200.0" class="main" text-anchor="middle">Choose your investment (once)</text>
<path class="flow" d="M700 221 V243 H210 V270"/>
<rect class="box" x="65" y="270" width="290" height="90" fill="#fff1c9"/>
<text x="210.0" y="309.0" class="main" text-anchor="middle">0 Megacoins</text>
<text x="210.0" y="335.0" class="small" text-anchor="middle">n = 0 technologies</text>
<path class="flow" d="M210 360 V378 H420 V402"/>
<path class="flow" d="M700 221 V243 H530 V270"/>
<rect class="box" x="385" y="270" width="290" height="90" fill="#fff1c9"/>
<text x="530.0" y="309.0" class="main" text-anchor="middle">1 Megacoin</text>
<text x="530.0" y="335.0" class="small" text-anchor="middle">n = 1 technology</text>
<path class="flow" d="M530 360 V378 H420 V402"/>
<path class="flow" d="M700 221 V243 H850 V270"/>
<rect class="box" x="705" y="270" width="290" height="90" fill="#fff1c9"/>
<text x="850.0" y="309.0" class="main" text-anchor="middle">2 Megacoins</text>
<text x="850.0" y="335.0" class="small" text-anchor="middle">n = 2 technologies</text>
<path class="flow" d="M850 360 V378 H420 V402"/>
<path class="flow" d="M700 221 V243 H1170 V270"/>
<rect class="box" x="1025" y="270" width="290" height="90" fill="#fff1c9"/>
<text x="1170.0" y="309.0" class="main" text-anchor="middle">3 Megacoins</text>
<text x="1170.0" y="335.0" class="small" text-anchor="middle">n = 3 technologies</text>
<path class="flow" d="M1170 360 V378 H420 V402"/>
<text x="420" y="425" class="main" text-anchor="middle">Then follow the schedule below.</text>
<text x="64" y="464" class="small" text-anchor="start">Lines rejoin only to save space. Rejoining does not erase earlier choices or combine their paths.</text>
<text x="64" y="510" class="section" text-anchor="start">2. Follow the rounds</text>
<text x="740" y="510" class="section" text-anchor="start">How the branches work</text>
<path d="M100 575 V1805" fill="none" stroke="#b42336" stroke-width="2" stroke-dasharray="6 5"/>
<rect class="box" x="190" y="540" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="569.0" class="main" text-anchor="middle">1. Policy round 1</text>
<text x="420.0" y="595.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 610 V645"/>
<path class="fail" d="M190 575 H100"/>
<rect class="box" x="190" y="645" width="460" height="70" fill="#f3e0ec"/>
<text x="420.0" y="674.0" class="main" text-anchor="middle">2. Random-event slot 1</text>
<text x="420.0" y="700.0" class="small" text-anchor="middle">No event, or an event with 2 responses.</text>
<path class="flow" d="M420 715 V750"/>
<path class="fail" d="M190 680 H100"/>
<rect class="box" x="190" y="750" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="779.0" class="main" text-anchor="middle">3. Policy round 2</text>
<text x="420.0" y="805.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 820 V855"/>
<path class="fail" d="M190 785 H100"/>
<rect class="box" x="190" y="855" width="460" height="70" fill="#fff1c9"/>
<text x="420.0" y="884.0" class="main" text-anchor="middle">4. Technology slot 1</text>
<text x="420.0" y="910.0" class="small" text-anchor="middle">If n ≥ 1: choose 1 of 3. Otherwise: skip.</text>
<path class="flow" d="M420 925 V960"/>
<rect class="box" x="190" y="960" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="989.0" class="main" text-anchor="middle">5. Policy round 3</text>
<text x="420.0" y="1015.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 1030 V1065"/>
<path class="fail" d="M190 995 H100"/>
<rect class="box" x="190" y="1065" width="460" height="70" fill="#f3e0ec"/>
<text x="420.0" y="1094.0" class="main" text-anchor="middle">6. Random-event slot 2</text>
<text x="420.0" y="1120.0" class="small" text-anchor="middle">No event, or an event with 2 responses.</text>
<path class="flow" d="M420 1135 V1170"/>
<path class="fail" d="M190 1100 H100"/>
<rect class="box" x="190" y="1170" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="1199.0" class="main" text-anchor="middle">7. Policy round 4</text>
<text x="420.0" y="1225.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 1240 V1275"/>
<path class="fail" d="M190 1205 H100"/>
<rect class="box" x="190" y="1275" width="460" height="70" fill="#f3e0ec"/>
<text x="420.0" y="1304.0" class="main" text-anchor="middle">8. Random-event slot 3</text>
<text x="420.0" y="1330.0" class="small" text-anchor="middle">No event, or an event with 2 responses.</text>
<path class="flow" d="M420 1345 V1380"/>
<path class="fail" d="M190 1310 H100"/>
<rect class="box" x="190" y="1380" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="1409.0" class="main" text-anchor="middle">9. Policy round 5</text>
<text x="420.0" y="1435.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 1450 V1485"/>
<path class="fail" d="M190 1415 H100"/>
<rect class="box" x="190" y="1485" width="460" height="70" fill="#fff1c9"/>
<text x="420.0" y="1514.0" class="main" text-anchor="middle">10. Technology slot 2</text>
<text x="420.0" y="1540.0" class="small" text-anchor="middle">If n ≥ 2: choose 1 of 3. Otherwise: skip.</text>
<path class="flow" d="M420 1555 V1590"/>
<rect class="box" x="190" y="1590" width="460" height="70" fill="#e2effd"/>
<text x="420.0" y="1619.0" class="main" text-anchor="middle">11. Policy round 6</text>
<text x="420.0" y="1645.0" class="small" text-anchor="middle">Choose 1 of 3 policies.</text>
<path class="flow" d="M420 1660 V1695"/>
<path class="fail" d="M190 1625 H100"/>
<rect class="box" x="190" y="1695" width="460" height="70" fill="#fff1c9"/>
<text x="420.0" y="1724.0" class="main" text-anchor="middle">12. Technology slot 3</text>
<text x="420.0" y="1750.0" class="small" text-anchor="middle">If n = 3: choose 1 of 3. Otherwise: skip.</text>
<path class="flow" d="M420 1765 V1810"/>
<path class="fail" d="M100 1805 V1810"/>
<rect class="box" x="190" y="1810" width="460" height="90" fill="#e3f4e9"/>
<text x="420.0" y="1849.0" class="main" text-anchor="middle">Finish all six rounds</text>
<text x="420.0" y="1875.0" class="small" text-anchor="middle">3,597,500 successful playthroughs</text>
<rect class="box" x="25" y="1810" width="140" height="90" fill="#fde8e8"/>
<text x="95.0" y="1836.0" class="body" text-anchor="middle">Game Over</text>
<text x="95.0" y="1862.0" class="small" text-anchor="middle">456,680</text>
<text x="95.0" y="1888.0" class="small" text-anchor="middle">early endings</text>
<rect x="740" y="540" width="600" height="245" rx="16" fill="#f7f9fc" stroke="#cbd5e1"/>
<text x="1040" y="578" class="main" text-anchor="middle">Each policy round: 3 branches</text>
<rect class="box" x="940" y="600" width="200" height="45" fill="#e2effd"/>
<text x="1040.0" y="629.5" class="body" text-anchor="middle">Your choice</text>
<path class="flow" d="M1040 645 V665 H835 V688"/>
<rect class="box" x="760" y="688" width="150" height="45" fill="#e2effd"/>
<text x="835.0" y="717.5" class="body" text-anchor="middle">Policy A</text>
<path class="flow" d="M1040 645 V665 H1040 V688"/>
<rect class="box" x="965" y="688" width="150" height="45" fill="#e2effd"/>
<text x="1040.0" y="717.5" class="body" text-anchor="middle">Policy B</text>
<path class="flow" d="M1040 645 V665 H1245 V688"/>
<rect class="box" x="1170" y="688" width="150" height="45" fill="#e2effd"/>
<text x="1245.0" y="717.5" class="body" text-anchor="middle">Policy C</text>
<text x="1040" y="766" class="small" text-anchor="middle">Each option continues with its own resources.</text>
<rect x="740" y="815" width="600" height="435" rx="16" fill="#f7f9fc" stroke="#cbd5e1"/>
<text x="1040" y="853" class="main" text-anchor="middle">Each event slot: 1 + 3 × 2 = 7 routes</text>
<text x="1040" y="885" class="small" text-anchor="middle">Each slot has its own events. You choose the response.</text>
<rect class="box" x="940" y="905" width="200" height="42" fill="#f3e0ec"/>
<text x="1040.0" y="933.0" class="body" text-anchor="middle">Random draw</text>
<path class="flow" d="M1040 947 V963 H830 V985"/>
<rect class="box" x="768" y="985" width="124" height="45" fill="#f3e0ec"/>
<text x="830.0" y="1014.5" class="small" text-anchor="middle">No event</text>
<path class="flow" d="M1040 947 V963 H980 V985"/>
<rect class="box" x="918" y="985" width="124" height="45" fill="#f3e0ec"/>
<text x="980.0" y="1014.5" class="small" text-anchor="middle">Event A</text>
<path class="flow" d="M1040 947 V963 H1130 V985"/>
<rect class="box" x="1068" y="985" width="124" height="45" fill="#f3e0ec"/>
<text x="1130.0" y="1014.5" class="small" text-anchor="middle">Event B</text>
<path class="flow" d="M1040 947 V963 H1280 V985"/>
<rect class="box" x="1218" y="985" width="124" height="45" fill="#f3e0ec"/>
<text x="1280.0" y="1014.5" class="small" text-anchor="middle">Event C</text>
<path class="flow" d="M830 1030 V1150"/>
<path class="flow" d="M980 1030 V1050 H950 V1080"/>
<rect class="box" x="926" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="950.0" y="1108.5" class="body" text-anchor="middle">1</text>
<path class="flow" d="M950 1123 V1150"/>
<path class="flow" d="M980 1030 V1050 H1010 V1080"/>
<rect class="box" x="986" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="1010.0" y="1108.5" class="body" text-anchor="middle">2</text>
<path class="flow" d="M1010 1123 V1150"/>
<path class="flow" d="M1130 1030 V1050 H1100 V1080"/>
<rect class="box" x="1076" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="1100.0" y="1108.5" class="body" text-anchor="middle">1</text>
<path class="flow" d="M1100 1123 V1150"/>
<path class="flow" d="M1130 1030 V1050 H1160 V1080"/>
<rect class="box" x="1136" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="1160.0" y="1108.5" class="body" text-anchor="middle">2</text>
<path class="flow" d="M1160 1123 V1150"/>
<path class="flow" d="M1280 1030 V1050 H1250 V1080"/>
<rect class="box" x="1226" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="1250.0" y="1108.5" class="body" text-anchor="middle">1</text>
<path class="flow" d="M1250 1123 V1150"/>
<path class="flow" d="M1280 1030 V1050 H1310 V1080"/>
<rect class="box" x="1286" y="1080" width="48" height="43" fill="#fff1c9"/>
<text x="1310.0" y="1108.5" class="body" text-anchor="middle">2</text>
<path class="flow" d="M1310 1123 V1150"/>
<circle cx="830" cy="1157" r="6" fill="#475569"/>
<circle cx="950" cy="1157" r="6" fill="#475569"/>
<circle cx="1010" cy="1157" r="6" fill="#475569"/>
<circle cx="1100" cy="1157" r="6" fill="#475569"/>
<circle cx="1160" cy="1157" r="6" fill="#475569"/>
<circle cx="1250" cy="1157" r="6" fill="#475569"/>
<circle cx="1310" cy="1157" r="6" fill="#475569"/>
<text x="1040" y="1194" class="tiny" text-anchor="middle">Response 1 or 2 for each event; no response for “no event”.</text>
<text x="1040" y="1228" class="small" text-anchor="middle">These seven routes are not equally likely.</text>
<rect x="740" y="1280" width="600" height="250" rx="16" fill="#f7f9fc" stroke="#cbd5e1"/>
<text x="1040" y="1318" class="main" text-anchor="middle">Technology slots depend on the initial payment</text>
<rect class="box" x="927" y="1345" width="226" height="45" fill="#fff1c9"/>
<text x="1040.0" y="1374.5" class="body" text-anchor="middle">n ≥ slot number?</text>
<path class="flow" d="M1040 1390 V1408 H900 V1430"/>
<path class="flow" d="M1040 1390 V1408 H1190 V1430"/>
<rect class="box" x="765" y="1430" width="270" height="50" fill="#fff1c9"/>
<text x="900.0" y="1462.0" class="body" text-anchor="middle">Yes: choose 1 of 3</text>
<rect class="box" x="1050" y="1430" width="270" height="50" fill="#f0f3f6"/>
<text x="1185.0" y="1462.0" class="small" text-anchor="middle">No: skip automatically</text>
<text x="1040" y="1510" class="small" text-anchor="middle">“No technology” is not a new choice after paying.</text>
<rect x="740" y="1570" width="600" height="210" rx="16" fill="#fff0f0" stroke="#b42336" stroke-width="2"/>
<text x="770" y="1610" class="main" text-anchor="start">Dashed red branches: stop at Game Over</text>
<text x="770" y="1647" class="body" text-anchor="start">After a policy or event response, stop if:</text>
<text x="790" y="1681" class="body" text-anchor="start">• happiness is zero or below, or</text>
<text x="790" y="1715" class="body" text-anchor="start">• the budget is zero or below.</text>
<text x="770" y="1753" class="body" text-anchor="start">Do not count any decisions after that point.</text>
<rect x="65" y="1940" width="1270" height="150" rx="16" fill="#f7f9fc" stroke="#cbd5e1"/>
<text x="700" y="1977" class="main" text-anchor="middle">Full plans if we ignore Game Over: 3⁶ × 7³ × (1 + 3 + 9 + 27) = 10,001,880</text>
<text x="700" y="2014" class="main" text-anchor="middle">Actual playthroughs: 3,597,500 finishes + 456,680 early endings = 4,054,180</text>
<text x="700" y="2054" class="small" text-anchor="middle">Count each visible path once. Exclude restarts and explanation/credits detours. Counts are not probabilities.</text>
</svg>
